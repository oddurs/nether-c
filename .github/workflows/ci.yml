name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install cairn
        run: cargo install cairn --locked || echo "cairn unavailable; scripts/task skips it"

      # CI and the local hooks run the same command, so they cannot drift.
      - name: scripts/task check
        run: scripts/task check

  required:
    name: required
    runs-on: ubuntu-latest
    needs: [check]
    if: always()
    steps:
      - name: Every job must have succeeded
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "check: ${{ needs.check.result }}"
            exit 1
          fi
          echo "green."
