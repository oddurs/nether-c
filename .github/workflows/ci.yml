name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
          # The Necropolis ships the core to a browser, and `scripts/task
          # check` builds for it. `scripts/setup` installs the same target.
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # From the repository it is actually published from, pinned to a commit, and
      # with no `||`.
      #
      # This used to be `cargo install cairn --locked || echo ...`, which was
      # wrong twice. `cairn` on crates.io is an unrelated crate — the binary
      # here comes from `cairn-md` — and the `||` meant that whatever the
      # install did, `scripts/task check` skipped `cairn check` and the run
      # stayed green. A gate that cannot fail is not one.
      - name: Install cairn
        run: cargo install --locked --git https://github.com/oddurs/cairn --rev 68ac1549383870aa57548da65ed25119895bb201 cairn-md

      # CI and the local hooks run the same command, so they cannot drift.
      - name: scripts/task check
        run: scripts/task check

  macos:
    name: macos
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: Hook portability check (BSD sed)
        run: |
          tmp=$(mktemp)
          printf 'fix(hooks): check CLAUDE.md scrub on macos\n' > "$tmp"
          .githooks/commit-msg "$tmp"
          rm -f "$tmp"

  required:
    name: required
    timeout-minutes: 2
    runs-on: ubuntu-latest
    needs: [check, macos]
    if: always()
    steps:
      - name: Every job must have succeeded
        run: |
          if [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.macos.result }}" != "success" ]; then
            echo "check: ${{ needs.check.result }}, macos: ${{ needs.macos.result }}"
            exit 1
          fi
          echo "green."
