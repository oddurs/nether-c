name: Release

# A tag is the trigger, and the tag is the version. `scripts/task release`
# makes one; nothing else should.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate CI runs. A release that skips it is a release nobody checked,
  # and this job used to be exactly that: it installed the wrong crate and hid
  # the failure behind `|| echo`, so the run went green whatever happened.
  check:
    name: check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # From the repository it is published from, pinned to a commit, and with no `||`.
      - name: Install cairn
        run: cargo install --locked --git https://github.com/oddurs/cairn --rev 68ac1549383870aa57548da65ed25119895bb201 cairn-md

      - name: scripts/task check
        run: scripts/task check

      - name: The tag must have a section in CHANGELOG.md
        run: scripts/notes "${GITHUB_REF_NAME}" > /dev/null

  build:
    name: build ${{ matrix.target }}
    timeout-minutes: 20
    needs: [check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      # The tag is the version, and this is where it becomes one. Without it
      # the binary reports `CARGO_PKG_VERSION`, which is the workspace version
      # and is `0.0.0` on purpose -- the crates are not published. v0.2.0
      # shipped three binaries that all said 0.0.0. 0271.
      - name: Build the binary
        run: |
          export NETHER_VERSION="${GITHUB_REF_NAME#v}"
          scripts/task release:build ${{ matrix.target }}

      # Asked of the artifact rather than of the build that made it. On native
      # targets, execute `--version` and match the exact `nether <version>`
      # banner; on cross-compiled targets that cannot run on this runner, check
      # the embedded version string directly.
      - name: The binary must say which release it is
        run: |
          bin="target/${{ matrix.target }}/release/nether"
          want="${GITHUB_REF_NAME#v}"
          host=$(rustc -vV | awk '/^host:/ { print $2 }')
          if grep -qFa "(not a release build)" "$bin"; then
            echo "::error::$bin was built without NETHER_VERSION"
            exit 1
          fi
          if [ "$host" = "${{ matrix.target }}" ]; then
            got=$("$bin" --version)
            if [ "$got" != "nether $want" ]; then
              echo "::error::$bin --version reported '$got', expected 'nether $want'"
              exit 1
            fi
          elif ! grep -qFa "$want" "$bin"; then
            echo "::error::$bin does not carry the version $want"
            exit 1
          fi
          echo "$bin carries nether $want"

      # One deterministic archive per target, named so a person can tell them
      # apart in a directory of downloads.
      - name: Archive it
        run: |
          name="nether-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/nether" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          python3 - "$name" <<'PY'
          import gzip, os, sys, tarfile
          name = sys.argv[1]
          root = os.path.join("dist", name)
          out = os.path.join("dist", f"{name}.tar.gz")
          with open(out, "wb") as out_fh:
              with gzip.GzipFile(filename="", mode="wb", fileobj=out_fh, mtime=0) as gz:
                  with tarfile.open(fileobj=gz, mode="w", format=tarfile.GNU_FORMAT) as tf:
                      for base, dirs, files in os.walk(root):
                          dirs.sort()
                          files.sort()
                          rel_dir = os.path.relpath(base, "dist")
                          info = tf.gettarinfo(base, arcname=rel_dir)
                          info.uid = info.gid = info.mtime = 0
                          info.uname = info.gname = ""
                          info.mode = 0o755
                          tf.addfile(info)
                          for fn in files:
                              path = os.path.join(base, fn)
                              rel = os.path.relpath(path, "dist")
                              info = tf.gettarinfo(path, arcname=rel)
                              info.uid = info.gid = info.mtime = 0
                              info.uname = info.gname = ""
                              info.mode = 0o755 if os.access(path, os.X_OK) else 0o644
                              with open(path, "rb") as fh:
                                  tf.addfile(info, fh)
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nether-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # 0221: the binary is reproducible, and this is where that is checked rather
  # than claimed. A second runner, with no cache from the first, builds the
  # same commit the same way and must get the same bytes the build job shipped.
  reproduce:
    name: reproduce x86_64-unknown-linux-gnu
    timeout-minutes: 20
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-gnu

      - name: Build it again
        run: |
          export NETHER_VERSION="${GITHUB_REF_NAME#v}"
          scripts/task release:build x86_64-unknown-linux-gnu

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nether-x86_64-unknown-linux-gnu
          path: shipped

      - name: The same bytes
        run: |
          tar -xzf shipped/*.tar.gz -C shipped
          a=$(sha256sum shipped/*/nether | cut -d' ' -f1)
          b=$(sha256sum target/x86_64-unknown-linux-gnu/release/nether | cut -d' ' -f1)
          echo "shipped $a"
          echo "rebuilt $b"
          [ "$a" = "$b" ] || { echo "::error::the binary did not reproduce"; exit 1; }

  publish:
    name: publish
    timeout-minutes: 10
    needs: [check, build, reproduce]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: incoming

      # Both weights of the face (regular and bold) ship directly alongside the
      # standalone LICENSE so anyone can use the WOFF files without cloning the
      # repository. 0235.
      - name: Gather what ships
        run: |
          mkdir -p dist
          find incoming -name '*.tar.gz' -exec cp {} dist/ \;
          cp site/nether.woff "dist/nether-${GITHUB_REF_NAME}.woff"
          cp site/nether-bold.woff "dist/nether-bold-${GITHUB_REF_NAME}.woff"
          cp LICENSE dist/LICENSE
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - spec/ docs/manual/ \
            | gzip -n > "dist/netherc-spec-${GITHUB_REF_NAME}.tar.gz"

      # A project whose argument is that you can name what you were given
      # should not ship tarballs nobody can check.
      - name: Write the checksums
        run: cd dist && rm -f SHA256SUMS && LC_ALL=C sha256sum * > ../SHA256SUMS && mv ../SHA256SUMS . && cat SHA256SUMS

      - name: The notes come from CHANGELOG.md
        run: scripts/notes "${GITHUB_REF_NAME}" > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
