[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Unlicense"
repository = "https://github.com/oddurs/nether-c"
homepage = "https://github.com/oddurs/nether-c"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true

# What ships to a browser. A separate profile rather than a smaller `release`,
# because the two want different things: the binary is built for speed and the
# module is built for the length of a download. 0074, and `scripts/wasm` holds
# the ceiling.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1
strip = true
