[package]
name = "nether-bury"
description = "Burial: partial evaluation, holes, and the residue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The two halves burial joins. A program is a fact about a source file until
# something names what it could not finish, and naming is the ledger.
nether-core = { path = "../nether-core" }
nether-ledger = { path = "../nether-ledger" }

[dev-dependencies]
# The round-trip proof §6.5 now requires: print a residue, lower it again,
# and insist it is the same program. No cycle — syntax depends only on core.
nether-syntax = { path = "../nether-syntax" }

[lints]
workspace = true
