[package]
name = "nether-cli"
description = "The rites: the Nether C command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nether"
path = "src/main.rs"

[dependencies]
nether-core = { path = "../nether-core" }
# `bury` is the rite that runs the whole pipeline: lex, parse, lower, check,
# bury, write.
nether-syntax = { path = "../nether-syntax" }
nether-bury = { path = "../nether-bury" }
nether-world = { path = "../nether-world" }
nether-ledger = { path = "../nether-ledger" }

[dev-dependencies]
# The browser's burial and this one have to agree, and the only way to know is
# to ask both. 0074.
nether-wasm = { path = "../nether-wasm" }

[lints]
workspace = true
